[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyzer"
version = "0.1.0"
description = "A股数据采集、分析、预测与可视化"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "akshare>=1.14",
    "pandas>=2.2",
    "plotly>=5.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "PySocks>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]
stats = [
    "statsmodels>=0.14",
]
ml = [
    "torch>=2.2",
]

[project.scripts]
stock-analyzer = "stock_analyzer.interface.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_analyzer = ["interface/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: 依赖外部网络或大数据集",
    "ml: 需要安装 .[ml] 可选依赖",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["stock_analyzer"]
strict = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "akshare",
    "akshare.*",
    "plotly",
    "plotly.*",
    "fastapi",
    "fastapi.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true
